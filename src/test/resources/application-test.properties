# Conexão com o H2
spring.datasource.url=jdbc:h2:mem:money_magnet
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração do JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.com
spring.mail.password=test-password

api.security.token.secret=test-secret-with-at-least-32-characters
app.frontend.base-url=http://localhost:3000

pluggy.base-url=http://localhost
pluggy.api-key=test-api-key
pluggy.client-id=test-client-id
pluggy.client-secret=test-client-secret
