name: CI - MoneyMagnet API

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Testes e Build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x ./mvnw

      - name: Executar testes e gerar build
        run: ./mvnw --batch-mode clean package

  deploy:
    name: Deploy no Render
    runs-on: ubuntu-latest

    needs: test

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Acionar deploy
        env:
          HOOK_DEPLOY_RENDER: ${{ secrets.HOOK_DEPLOY_RENDER }}
        run: |
          test -n "$HOOK_DEPLOY_RENDER"
          curl --fail-with-body \
            --silent \
            --show-error \
            --request GET \
            "$HOOK_DEPLOY_RENDER"